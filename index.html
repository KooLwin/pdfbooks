<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kreative · PDF Premium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background: #f2f4f8;
            padding: 16px;
            margin: 0;
            position: relative;
        }

        .container {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 48px;
            padding: 40px 28px 36px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 0 0 0.5px rgba(0, 0, 0, 0.02) inset;
            border: 0.5px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -40%;
            left: -20%;
            width: 140%;
            height: 80%;
            background: radial-gradient(circle at 30% 20%, rgba(200, 210, 230, 0.2), transparent 70%);
            pointer-events: none;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1c1e24;
            margin-bottom: 4px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }

        .subtitle {
            font-size: 17px;
            font-weight: 400;
            color: #5e6472;
            letter-spacing: -0.2px;
            margin-bottom: 28px;
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 16px;
        }

        .input-wrapper {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            padding: 4px 16px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: border 0.2s, background 0.2s;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .input-wrapper:focus-within {
            border-color: #007aff;
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.08);
        }

        #secretCode {
            width: 100%;
            padding: 18px 8px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 8px;
            text-align: center;
            background: transparent;
            border: none;
            outline: none;
            color: #1c1e24;
            caret-color: #007aff;
            font-family: inherit;
        }

        #secretCode::placeholder {
            color: #a8adb8;
            font-weight: 400;
            letter-spacing: 2px;
            font-size: 18px;
        }

        #secretCode:disabled {
            opacity: 0.5;
            color: #8e94a0;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 4px;
        }

        button {
            padding: 18px 20px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 40px;
            background: #007aff;
            color: white;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.25);
            width: 100%;
            position: relative;
            overflow: hidden;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        button:active:not(:disabled) {
            transform: scale(0.97);
            opacity: 0.85;
        }

        button:disabled {
            background: #a8b0c0;
            box-shadow: none;
            opacity: 0.5;
            cursor: not-allowed;
            border-color: transparent;
        }

        .download-button {
            background: linear-gradient(145deg, #007aff, #0055b3);
            box-shadow: 0 6px 20px rgba(0, 122, 255, 0.25);
        }

        .download-button:active:not(:disabled) {
            background: linear-gradient(145deg, #0055b3, #003d8a);
        }

        #message {
            margin-top: 18px;
            font-size: 15px;
            font-weight: 500;
            min-height: 28px;
            letter-spacing: -0.2px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.02);
        }

        .error { color: #d13a3a; background: rgba(255, 80, 80, 0.06); }
        .success { color: #1e7b3c; background: rgba(60, 200, 80, 0.06); }
        .info { color: #0066cc; background: rgba(0, 122, 255, 0.06); }
        .warning { color: #b8860b; background: rgba(255, 200, 50, 0.06); }

        .timer {
            margin-top: 14px;
            font-size: 15px;
            font-weight: 500;
            color: #5e6a7e;
            letter-spacing: 0.2px;
            background: rgba(0, 0, 0, 0.02);
            padding: 10px 16px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            border: 0.5px solid rgba(0, 0, 0, 0.04);
        }

        .security-badge {
            margin-top: 24px;
            font-size: 12px;
            font-weight: 400;
            color: #8e94a0;
            letter-spacing: 0.5px;
            border-top: 0.5px solid rgba(0, 0, 0, 0.05);
            padding-top: 18px;
            text-transform: uppercase;
        }

        /* MacBook style loading */
        .spinner-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 48px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 20;
        }

        .spinner-overlay.active {
            display: flex;
        }

        .mac-spinner {
            width: 52px;
            height: 52px;
            position: relative;
        }

        .mac-spinner svg {
            width: 52px;
            height: 52px;
            animation: mac-rotate 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            transform-origin: center;
        }

        .mac-spinner .track {
            fill: none;
            stroke: rgba(0, 0, 0, 0.06);
            stroke-width: 3.5;
        }

        .mac-spinner .arc {
            fill: none;
            stroke: #007aff;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-dasharray: 110;
            stroke-dashoffset: 0;
            animation: mac-arc 1.2s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes mac-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes mac-arc {
            0% { stroke-dashoffset: 110; }
            50% { stroke-dashoffset: 30; }
            100% { stroke-dashoffset: 110; }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 15px;
            font-weight: 500;
            color: #1c1e24;
            letter-spacing: 0.2px;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .loading-text .dots {
            display: inline-flex;
            width: 28px;
        }

        .loading-text .dots span {
            animation: mac-dot 1.4s infinite both;
            font-size: 20px;
            line-height: 1;
            letter-spacing: 2px;
        }

        .loading-text .dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-text .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes mac-dot {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.1); }
        }

        #closeButton {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #1c1e24;
            border-radius: 50%;
            text-align: center;
            line-height: 44px;
            font-size: 22px;
            font-weight: 300;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            border: 0.5px solid rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
            user-select: none;
        }

        #closeButton:active {
            transform: scale(0.88);
            background: rgba(255, 255, 255, 0.9);
        }

        /* Fullscreen button (close tab) */
        #fullscreenHint {
            margin-top: 6px;
            font-size: 12px;
            color: #8e94a0;
            opacity: 0.6;
            letter-spacing: 0.3px;
        }

        @media (max-width: 420px) {
            .container {
                padding: 32px 20px 28px;
                border-radius: 36px;
            }
            h1 { font-size: 28px; }
            #secretCode { font-size: 22px; letter-spacing: 6px; padding: 14px 4px; }
            button { font-size: 17px; padding: 16px; }
            .mac-spinner { width: 44px; height: 44px; }
            .mac-spinner svg { width: 44px; height: 44px; }
        }
    </style>
</head>
<body>

    <div id="closeButton" aria-label="Close">✕</div>

    <div class="container">
        <div class="spinner-overlay" id="loadingOverlay">
            <div class="mac-spinner">
                <svg viewBox="0 0 52 52">
                    <circle class="track" cx="26" cy="26" r="22" />
                    <circle class="arc" cx="26" cy="26" r="22" />
                </svg>
            </div>
            <div class="loading-text">
                Connecting
                <span class="dots">
                    <span>.</span><span>.</span><span>.</span>
                </span>
            </div>
        </div>

        <h1>Kreative</h1>
        <div class="subtitle">PDF Books · Premium</div>

        <div class="input-wrapper">
            <input type="text" id="secretCode" maxlength="6" placeholder="BOOK ID" autofocus aria-label="6-digit code">
        </div>

        <div class="btn-group">
            <button class="download-button" id="downloadBtn">📥 Download PDF</button>
        </div>

        <div id="message"></div>
        <div id="timerDisplay" class="timer"> Enter your Book ID Here</div>
        <div class="security-badge"> Secure · encrypted</div>
    </div>

    <script>
        (function() {
            var scriptUrl = 'https://script.google.com/macros/s/AKfycbzlcNGBBge_QEk6M6RG2uQ18nL2MJWdqOJg7LsJBJdJZ3_WqOGueuYX2dhU2-mRJNqrPw/exec';
            var storageKey = 'nurseryPhonicsData';
            var systemKey = 'nurseryPhonicsSystem';
            var gateExpiryKey = 'accessGateExpiry';

            var loadingOverlay = document.getElementById('loadingOverlay');
            var secretInput = document.getElementById('secretCode');
            var downloadBtn = document.getElementById('downloadBtn');
            var messageEl = document.getElementById('message');
            var timerDisplay = document.getElementById('timerDisplay');

            function showLoading() {
                loadingOverlay.classList.add('active');
            }

            function hideLoading() {
                loadingOverlay.classList.remove('active');
            }

            function showError(text) {
                messageEl.className = 'error';
                messageEl.textContent = text;
                clearMessageAfter(10000);
            }

            function showSuccess(text) {
                messageEl.className = 'success';
                messageEl.textContent = text;
            }

            function clearMessageAfter(ms) {
                if (window._msgTimer) clearTimeout(window._msgTimer);
                window._msgTimer = setTimeout(function() {
                    if (messageEl.className !== 'success') {
                        messageEl.textContent = '';
                        messageEl.className = '';
                    }
                }, ms);
            }

            function getSystemData() {
                try {
                    var data = localStorage.getItem(systemKey);
                    if (data) return JSON.parse(atob(data));
                } catch (_) {}
                return null;
            }

            function saveSystemData(timestamp) {
                try {
                    var data = JSON.stringify({ lastCheck: timestamp, installDate: timestamp });
                    localStorage.setItem(systemKey, btoa(data));
                } catch (_) {}
            }

            function getSystemTime() {
                var now = Date.now();
                var sys = getSystemData();
                if (sys) {
                    if (sys.lastCheck > now) {
                        return { valid: false, reason: 'backdate_detected', storedTime: sys.lastCheck, currentTime: now };
                    }
                    if (now - sys.lastCheck > 24 * 60 * 60 * 1000) {
                        saveSystemData(now);
                    }
                } else {
                    saveSystemData(now);
                }
                return { valid: true, timestamp: now };
            }

            function getGateExpiry() {
                var val = localStorage.getItem(gateExpiryKey);
                return val !== null ? parseInt(val, 10) : null;
            }

            function setGateExpiry(timestamp) {
                localStorage.setItem(gateExpiryKey, timestamp.toString());
            }

            async function fetchCodes() {
                try {
                    var resp = await fetch(scriptUrl + '?action=fetchCodes&_=' + Date.now());
                    return await resp.json();
                } catch (e) {
                    showError('Network error. Please try again.');
                    return [];
                }
            }

            async function logCodeUsage(code) {
                try {
                    await fetch(scriptUrl + '?action=logCode&code=' + code + '&deviceInfo=' + encodeURIComponent(navigator.userAgent));
                } catch (_) {}
            }

            function openFullscreen(url) {
                var win = window.open(url, '_blank');
                if (win) {
                    try {
                        win.moveTo(0, 0);
                        win.resizeTo(screen.width, screen.height);
                    } catch (e) {}
                    win.focus();
                } else {
                    window.location.href = url;
                }
            }

            async function handleDownload() {
                var code = secretInput.value.trim().toUpperCase();
                if (code.length !== 6) {
                    showError('Enter exactly 6 characters');
                    return;
                }

                showLoading();
                try {
                    var codes = await fetchCodes();
                    if (!codes || codes.length === 0) {
                        hideLoading();
                        showError('Could not verify code. Check connection.');
                        return;
                    }

                    var matched = null;
                    for (var i = 0; i < codes.length; i++) {
                        if (codes[i].code === code) {
                            matched = codes[i];
                            break;
                        }
                    }

                    if (!matched) {
                        hideLoading();
                        showError('Invalid or expired code');
                        return;
                    }

                    await logCodeUsage(code);

                    var expires = Date.now() + Number(matched.duration);
                    var currentGate = getGateExpiry();
                    if (currentGate !== null && currentGate > Date.now()) {
                        expires = currentGate + Number(matched.duration);
                    }
                    setGateExpiry(expires);

                    var payload = JSON.stringify({ code: matched.code, expires: expires, url: matched.url });
                    localStorage.setItem(storageKey, btoa(payload));

                    hideLoading();
                    showSuccess('Access granted! Opening PDF…');

                    setTimeout(function() {
                        openFullscreen(matched.url);
                    }, 600);

                } catch (err) {
                    hideLoading();
                    showError('Network error. Try again.');
                }
            }

            function updateTimer() {
                var gateExpiry = getGateExpiry();
                if (gateExpiry !== null && gateExpiry > Date.now()) {
                    var remainingMs = gateExpiry - Date.now();
                    var days = Math.floor(remainingMs / (86400000));
                    var hours = Math.floor((remainingMs % 86400000) / 3600000);
                    var mins = Math.floor((remainingMs % 3600000) / 60000);

                    var text = '';
                    if (days > 0) text = days + 'd ' + hours + 'h';
                    else if (hours > 0) text = hours + 'h ' + mins + 'm';
                    else if (mins > 0) text = mins + 'm';
                    else text = '< 1m';

                    timerDisplay.textContent = '⏱ ' + text + ' remaining';
                    timerDisplay.style.color = '#5e6a7e';
                } else {
                    timerDisplay.textContent = '🔑 Enter your code';
                    timerDisplay.style.color = '#8e94a0';
                }
            }

            document.addEventListener('DOMContentLoaded', function() {
                var sysCheck = getSystemTime();
                if (!sysCheck.valid && sysCheck.reason === 'backdate_detected') {
                    showError('System time tampering detected!');
                    secretInput.disabled = true;
                    downloadBtn.disabled = true;
                    return;
                }

                secretInput.disabled = false;
                downloadBtn.disabled = false;

                updateTimer();
                setInterval(updateTimer, 30000);

                setInterval(function() {
                    var sc = getSystemTime();
                    if (!sc.valid && sc.reason === 'backdate_detected') {
                        showError('System time tampering!');
                        secretInput.disabled = true;
                        downloadBtn.disabled = true;
                    }
                }, 30000);
            });

            secretInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleDownload();
            });

            downloadBtn.addEventListener('click', handleDownload);

            document.getElementById('closeButton').addEventListener('click', function() {
                if (window.opener && !window.opener.closed) {
                    window.close();
                } else {
                    window.history.length > 1 ? window.history.back() : window.close();
                }
            });

            window.handleDownload = handleDownload;
            setTimeout(function() { secretInput.focus(); }, 300);
        })();
    </script>
</body>
</html>
